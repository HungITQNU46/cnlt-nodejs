<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#f1f5f9] font-sans">
    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center text-sm font-bold">
            <span>NODE<span class="text-emerald-400">HUB</span></span>
            <div class="space-x-6 uppercase">
                <a href="/" class="hover:text-emerald-400 transition">Trang chủ</a>
                <a href="/events" class="hover:text-emerald-400 transition">Events</a>
                <a href="/request" class="hover:text-emerald-400 transition">Request</a>
                <a href="/streams" class="text-emerald-400 transition">Streams</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-10 px-6">
        <h2 class="text-4xl font-black text-slate-900 mb-10 text-center uppercase tracking-tighter">Stream <span class="text-emerald-600">Management</span></h2>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <section class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                <h3 class="text-xl font-black mb-4 text-blue-600 flex items-center">
                    <i class="fa-solid fa-file-export mr-3"></i> 4.1 READABLE
                </h3>
                <div class="bg-slate-900 text-emerald-400 p-5 rounded-2xl font-mono text-sm h-40 overflow-auto border-4 border-slate-800">
                    Dữ liệu đọc từ file story.txt qua fs.createReadStream()...
                </div>
            </section>

            <section class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                <h3 class="text-xl font-black mb-4 text-purple-600 flex items-center">
                    <i class="fa-solid fa-file-import mr-3"></i> 4.2 WRITABLE
                </h3>
                <form action="/streams" method="POST" class="space-y-4">
                    <textarea name="content" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:border-purple-500 outline-none transition" rows="3" placeholder="Nhập nội dung để ghi vào file..."></textarea>
                    <button class="w-full bg-purple-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-purple-200 hover:bg-purple-700 transition active:scale-95">GHI DỮ LIỆU</button>
                </form>
            </section>

            <section class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                <h3 class="text-xl font-black mb-4 text-rose-600 flex items-center">
                    <i class="fa-solid fa-wand-magic-sparkles mr-3"></i> 4.3 TRANSFORM
                </h3>
                <div class="p-6 bg-rose-50 text-rose-700 rounded-2xl font-bold border-2 border-dashed border-rose-200 text-center uppercase">
                    Dữ liệu Uppercase qua Transform Stream
                </div>
            </section>

            <section class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                <h3 class="text-xl font-black mb-4 text-cyan-600 flex items-center">
                    <i class="fa-solid fa-repeat mr-3"></i> 4.4 DUPLEX (ECHO)
                </h3>
                <div class="flex items-center justify-center h-24 border-2 border-slate-100 rounded-2xl bg-slate-50">
                    <span class="text-slate-400 font-bold italic tracking-widest">ECHO MODE: ACTIVE</span>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
