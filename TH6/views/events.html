<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans">
    <nav class="bg-slate-900 text-white p-4 shadow-xl">
        <div class="container mx-auto flex justify-between items-center">
            <span class="font-bold text-xl tracking-tight">NODE<span class="text-emerald-400">HUB</span></span>
            <div class="space-x-8 text-sm font-bold uppercase">
                <a href="/" class="hover:text-emerald-400">Trang chủ</a>
                <a href="/events" class="text-emerald-400">Events</a>
                <a href="/request" class="hover:text-emerald-400">Request</a>
                <a href="/streams" class="hover:text-emerald-400">Streams</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-12 px-6">
        <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-8">
            <div class="flex items-center space-x-4 mb-6">
                <div class="w-12 h-12 bg-amber-100 rounded-2xl flex items-center justify-center text-amber-600">
                    <i class="fa-solid fa-bolt text-2xl"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800 uppercase">EventEmitter Demo</h2>
            </div>
            
            <div class="p-6 bg-slate-50 rounded-2xl border-l-4 border-amber-500 mb-8">
                <p class="text-slate-600 font-medium italic">
                    "Mỗi khi bạn truy cập trang này, sự kiện <b>'logAction'</b> đã được emit và ghi dữ liệu vào file <b>log.txt</b> thông qua AppEmitter."
                </p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="p-4 border rounded-xl bg-white">
                    <span class="text-xs font-bold text-slate-400 uppercase">Method</span>
                    <p class="font-bold text-slate-700">emit()</p>
                </div>
                <div class="p-4 border rounded-xl bg-white">
                    <span class="text-xs font-bold text-slate-400 uppercase">Listener</span>
                    <p class="font-bold text-slate-700">on()</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
