<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans">
    <nav class="bg-slate-900 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <span class="font-bold text-xl">NODE<span class="text-emerald-400">HUB</span></span>
            <div class="space-x-8 text-sm font-bold uppercase">
                <a href="/" class="hover:text-emerald-400">Trang chủ</a>
                <a href="/events" class="hover:text-emerald-400">Events</a>
                <a href="/request" class="text-emerald-400">Request</a>
                <a href="/streams" class="hover:text-emerald-400">Streams</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto py-12 px-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs font-black text-slate-400 uppercase tracking-widest">HTTP Status</p>
                <p class="text-2xl font-black text-emerald-500 uppercase">200 OK</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-2">
                <p class="text-xs font-black text-slate-400 uppercase tracking-widest">Server Response</p>
                <p class="text-lg font-mono text-slate-700">X-Powered-By: Hung-NodeJS-Server</p>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 px-8 py-4 text-white font-bold flex justify-between items-center">
                <span>REQUEST HEADERS</span>
                <i class="fa-solid fa-code text-emerald-400"></i>
            </div>
            <div class="p-8">
                <p class="text-slate-500 italic">Dữ liệu Header được server ghi trực tiếp qua res.write()</p>
            </div>
        </div>
    </main>
</body>
</html>
